spring.application.name=multi-db-demo
server.port=8080

# =========================================================
# PRIMARY DATASOURCE -> employee database (Employee CRUD)
# =========================================================
app.datasource.primary.jdbc-url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
app.datasource.primary.username=sa
app.datasource.primary.password=
app.datasource.primary.driver-class-name=org.h2.Driver

# =========================================================
# SECONDARY DATASOURCE -> owner database (Owner CRUD)
# =========================================================
app.datasource.secondary.jdbc-url=jdbc:h2:mem:ownerdb;DB_CLOSE_DELAY=-1
app.datasource.secondary.username=sa
app.datasource.secondary.password=

app.datasource.secondary.driver-class-name=org.h2.Driver

# Auto create/update schema for both persistence units on startup (demo only,
# use Flyway/Liquibase per-datasource for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# H2 console (optional, handy for inspecting both DBs while the app is running)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
